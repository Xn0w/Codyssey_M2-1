<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인제 도로·교통 소식 (가상)</title>
<style>
:root{--bg:#f6f4ef;--paper:#fff;--ink:#1d1f23;--dim:#6b6f76;--line:#e3dfd6;--accent:#b8321f;--guide:#1f5fb8;--hl:#fff3b0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
a{color:inherit}
header{background:var(--paper);border-bottom:3px double var(--ink)}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 0 10px;flex-wrap:wrap}
.mast h1{margin:0;font:800 28px/1.1 "Noto Serif KR",Georgia,serif;letter-spacing:-.5px}
.mast .sub{color:var(--dim);font-size:12px;margin-top:4px}
.fake{display:inline-block;border:1px solid var(--accent);color:var(--accent);font-size:11px;padding:1px 6px;border-radius:3px;margin-left:6px;vertical-align:middle}
.clock{text-align:right;font-size:13px;color:var(--dim)}
.clock b{color:var(--ink);font-size:16px}
nav{display:flex;gap:4px;border-top:1px solid var(--line);padding:6px 0;flex-wrap:wrap}
nav button{border:0;background:none;padding:6px 12px;font:inherit;cursor:pointer;color:var(--dim);border-radius:4px}
nav button.on{color:var(--ink);font-weight:700;background:var(--bg)}
.time{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin-left:auto}
.time input[type=range]{width:180px}
main{display:grid;grid-template-columns:1fr 340px;gap:20px;padding:20px 0 40px}
@media (max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:12px;cursor:pointer}
.card:hover{border-color:#cfc8b8}
.meta{font-size:12px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.k{font-size:11px;font-weight:700;padding:1px 6px;border-radius:3px;color:#fff;background:var(--accent)}
.k.guide{background:var(--guide)}
.card h2{margin:6px 0 4px;font:700 18px/1.4 "Noto Serif KR",Georgia,serif}
.card p{margin:0;color:#3b3e44}
.roads{font-size:12px;color:var(--dim);margin-top:6px}
.article{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:22px 24px}
.article h2{font:800 24px/1.35 "Noto Serif KR",Georgia,serif;margin:8px 0 12px}
.article .body p{margin:0 0 12px}
.back{font-size:13px;color:var(--dim);cursor:pointer;margin-bottom:10px;display:inline-block}
aside .box{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:12px}
aside h3{margin:0 0 8px;font-size:14px}
.search input,.search select{width:100%;font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:4px;margin-bottom:6px;background:#fff}
.search button{width:100%;font:inherit;padding:8px;border:0;border-radius:4px;background:var(--ink);color:#fff;cursor:pointer}
.hit{border-top:1px solid var(--line);padding:8px 0;font-size:13px}
.hit:first-child{border-top:0}
.hit .t{font-weight:700;cursor:pointer}
.hit .s{color:var(--dim);font-size:12px}
.hit .c{background:var(--hl);padding:2px 4px;border-radius:2px;display:block;margin-top:4px;font-size:12.5px}
.empty{color:var(--dim);font-size:13px;padding:10px 0}
.note{font-size:12px;color:var(--dim)}
footer{border-top:1px solid var(--line);color:var(--dim);font-size:12px;padding:12px 0 30px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="mast">
      <div>
        <h1>인제 도로·교통 소식<span class="fake">가상</span></h1>
        <div class="sub" id="src">가상 시연 자료 · 실제 보도·실제 지침 아님</div>
      </div>
      <div class="clock"><span id="clockLbl">기준 시각</span><br><b id="clock">–</b></div>
    </div>
    <nav>
      <button data-k="" class="on">전체</button>
      <button data-k="news">교통 기사</button>
      <button data-k="guide">도로 운영 지침</button>
      <div class="time">
        <label><input type="checkbox" id="follow" checked> 서버 시각 따라가기</label>
        <input type="range" id="t" min="0" max="3600" step="60" value="0" title="이 시각까지 나온 자료만 보인다">
        <span id="tl"></span>
      </div>
    </nav>
  </div>
</header>

<div class="wrap">
  <main>
    <section id="view"></section>
    <aside>
      <div class="box search">
        <h3>자료 검색</h3>
        <input id="q" placeholder="예: 설악로 통제 언제 풀리나">
        <input id="roads" placeholder="도로 id (쉼표, 선택) 예: 682501434">
        <select id="kind"><option value="">기사·지침 모두</option><option value="news">기사만</option><option value="guide">지침만</option></select>
        <button id="go">검색</button>
        <div class="note" style="margin-top:8px">도로 AI 가 쓰는 것과 같은 검색 API (<code>/news/api/search</code>). 그 시각까지 나온 자료만 찾는다.</div>
      </div>
      <div class="box"><h3>검색 결과</h3><div id="hits" class="empty">검색어를 넣으면 순위가 나온다.</div></div>
    </aside>
  </main>
</div>
<footer><div class="wrap" id="foot"></div></footer>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const S = {kind: "", now: null, follow: true, list: null};
const get = async u => { const r = await fetch(u); if (!r.ok) throw new Error(r.status + " " + (await r.text()).slice(0, 120)); return r.json(); };
const nowQ = () => S.follow ? "" : `now_s=${S.now}`;
const kindLabel = k => k === "guide" ? "운영 지침" : "교통 기사";
const roads = d => d.road_names && d.road_names.length ? `관련 도로 · ${esc(d.road_names.slice(0, 4).join(", "))}${d.road_names.length > 4 ? ` 외 ${d.road_names.length - 4}` : ""}` : "모든 도로에 해당";

async function loadList(){
  const d = await get(`/news/api/articles?${nowQ()}${S.kind ? `&kind=${S.kind}` : ""}`);
  S.list = d;
  if (S.follow){ S.now = d.now_s; $("#t").value = Math.min(+$("#t").max, d.now_s); }
  $("#clock").textContent = d.now_kst;
  $("#tl").textContent = d.now_kst;
  $("#src").textContent = `${d.source} · 자료 ${d.total}건`;
  $("#foot").textContent = d.upcoming ? `이 시각 이후에 나올 자료 ${d.upcoming}건은 아직 보이지 않는다 (도로 AI 도 미래 기사는 못 읽는다).` : "";
  if (!location.hash.startsWith("#/")) drawList();
}

function drawList(){
  const d = S.list; if (!d) return;
  $("#view").innerHTML = d.articles.length ? d.articles.map(a => `
    <div class="card" data-id="${esc(a.id)}">
      <div class="meta"><span class="k ${a.kind}">${kindLabel(a.kind)}</span><span>${esc(a.id)}</span>
        <span>${a.published_kst ? esc(a.published_kst) + " 보도" : "상시 지침"}</span></div>
      <h2>${esc(a.title)}</h2><p>${esc(a.excerpt)}</p><div class="roads">${roads(a)}</div>
    </div>`).join("") : `<div class="empty">이 시각까지 나온 자료가 없다.</div>`;
  document.querySelectorAll(".card").forEach(c => c.onclick = () => location.hash = "#/" + c.dataset.id);
}

async function drawArticle(id){
  try {
    const a = await get(`/news/api/articles/${encodeURIComponent(id)}?${nowQ()}`);
    $("#view").innerHTML = `<span class="back" id="back">← 목록</span><div class="article">
      <div class="meta"><span class="k ${a.kind}">${kindLabel(a.kind)}</span><span>${esc(a.id)}</span>
      <span>${a.published_kst ? esc(a.published_kst) + " 보도" : "상시 지침"}</span></div>
      <h2>${esc(a.title)}</h2><div class="body">${a.body.split(/\n\s*\n/).map(p => `<p>${esc(p)}</p>`).join("")}</div>
      <div class="roads">${roads(a)}${a.road_ids.length ? ` <span class="note">(id ${esc(a.road_ids.slice(0, 6).join(", "))}${a.road_ids.length > 6 ? " …" : ""})</span>` : ""}</div></div>`;
  } catch (e) {
    $("#view").innerHTML = `<span class="back" id="back">← 목록</span><div class="empty">${esc(id)}: 없거나 아직 나오지 않은 자료다.</div>`;
  }
  $("#back").onclick = () => location.hash = "";
}

async function search(){
  const q = $("#q").value.trim(); if (!q) return;
  const p = new URLSearchParams({q, k: 5}); if (!S.follow) p.set("now_s", S.now);
  const r = $("#roads").value.replace(/\s/g, ""); if (r) p.set("road_ids", r);
  if ($("#kind").value) p.set("kind", $("#kind").value);
  try {
    const d = await get(`/news/api/search?${p}`);
    const how = d.fusion === "rrf" ? "BM25 + 임베딩, 순위 합치기(RRF)" : "BM25 (임베딩 없음)";
    $("#hits").className = "";
    $("#hits").innerHTML = `<div class="note">${esc(d.now_kst)} 기준 · ${how} · 도로 필터 ${esc(d.road_filter)} · 조각 ${d.chunks_scored}개 비교</div>` +
      (d.hits.length ? d.hits.map((h, i) => `<div class="hit">
        <div class="t" data-id="${esc(h.id)}">${i + 1}. [${esc(h.id)}] ${esc(h.title)}</div>
        <div class="s">점수 ${h.score} · BM25 ${h.bm25} (${h.rank_bm25}위)${h.cosine != null ? ` · 임베딩 ${h.cosine} (${h.rank_cosine}위)` : ""} · 조각 ${esc(h.chunk_ids.join(", "))}</div>
        <span class="c">${esc(h.body)}</span></div>`).join("") : `<div class="empty">맞는 자료가 없다.</div>`);
    document.querySelectorAll(".hit .t").forEach(t => t.onclick = () => location.hash = "#/" + t.dataset.id);
  } catch (e) { $("#hits").innerHTML = `<div class="empty">검색 실패: ${esc(e.message)}</div>`; }
}

function route(){ const m = location.hash.match(/^#\/(.+)$/); m ? drawArticle(decodeURIComponent(m[1])) : drawList(); }
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  S.kind = b.dataset.k; location.hash = ""; loadList();
});
$("#follow").onchange = () => { S.follow = $("#follow").checked; loadList(); };
$("#t").oninput = () => { $("#follow").checked = S.follow = false; S.now = +$("#t").value; loadList(); };
$("#go").onclick = search;
$("#q").onkeydown = e => { if (e.key === "Enter") search(); };
window.onhashchange = route;
const qs = new URLSearchParams(location.search);
if (qs.get("q")){ $("#q").value = qs.get("q"); if (qs.get("road_ids")) $("#roads").value = qs.get("road_ids"); }
loadList().then(() => { route(); if (qs.get("q")) search(); }).catch(e => $("#view").innerHTML = `<div class="empty">불러오기 실패: ${esc(e.message)}</div>`);
setInterval(() => { if (S.follow) loadList().catch(() => {}); }, 5000);
</script>
</body>
</html>
