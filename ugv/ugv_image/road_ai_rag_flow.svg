<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif" font-size="14">
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#3b4652"/></marker>
  <marker id="p" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#7a4fc9"/></marker>
  <marker id="g" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b08a3e"/></marker></defs>
  <rect width="1000" height="520" fill="#ffffff"/>
  <!-- UGV 서버 -->
  <rect x="30" y="40" width="260" height="360" rx="10" fill="#eef4fb" stroke="#2f7dd1" stroke-width="2"/>
  <text x="160" y="68" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e86">UGV 서버 (로컬)</text>
  <rect x="50" y="85" width="220" height="58" rx="6" fill="#ffffff" stroke="#2f7dd1"/>
  <text x="160" y="109" text-anchor="middle">주행 감시 (0.5초마다)</text>
  <text x="160" y="129" text-anchor="middle" fill="#5b6672" font-size="13">앞길 통제 발견 → 도로 AI 호출</text>
  <rect x="50" y="160" width="220" height="58" rx="6" fill="#ffffff" stroke="#2f7dd1"/>
  <text x="160" y="184" text-anchor="middle">도로 AI 모듈 (road_ai.py)</text>
  <text x="160" y="204" text-anchor="middle" fill="#5b6672" font-size="13">상황·선택지·도구를 묶어 요청</text>
  <rect x="50" y="235" width="220" height="58" rx="6" fill="#ffffff" stroke="#2f7dd1"/>
  <text x="160" y="259" text-anchor="middle">지식 검색 (road_news.py)</text>
  <text x="160" y="279" text-anchor="middle" fill="#5b6672" font-size="13">BM25 + 임베딩, 시각·도로 필터</text>
  <rect x="50" y="330" width="220" height="50" rx="6" fill="#ffffff" stroke="#2f7dd1"/>
  <text x="160" y="351" text-anchor="middle">결정 적용: 대기 / 우회</text>
  <text x="160" y="370" text-anchor="middle" fill="#5b6672" font-size="12">AGENT_REQUEST / TOOL / DECISION 기록</text>
  <!-- 지식 파일 -->
  <rect x="30" y="430" width="260" height="60" rx="6" fill="#f6f1e4" stroke="#b08a3e"/>
  <text x="160" y="453" text-anchor="middle" fill="#6b5420" font-size="13">가상 교통 기사 N1–N13 · 운영 지침 G1–G3</text>
  <text x="160" y="475" text-anchor="middle" fill="#6b5420" font-size="11">ugv/knowledge · scenarios/twin_inje/news (로컬 파일)</text>
  <line x1="160" y1="293" x2="160" y2="430" stroke="#b08a3e" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- LLM -->
  <rect x="660" y="90" width="270" height="250" rx="10" fill="#f2eefb" stroke="#7a4fc9" stroke-width="2"/>
  <text x="795" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a2a8a">생성형 AI (Gemini, 외부 API)</text>
  <text x="795" y="142" text-anchor="middle" fill="#5b6672" font-size="13">function calling — 쓸 수 있는 도구 2개</text>
  <rect x="680" y="160" width="230" height="64" rx="6" fill="#ffffff" stroke="#7a4fc9"/>
  <text x="795" y="183" text-anchor="middle" font-family="monospace" font-size="12">search_road_news(query, road_ids)</text>
  <text x="795" y="205" text-anchor="middle" fill="#5b6672" font-size="12">"이 도로 자료를 찾아 달라"</text>
  <rect x="680" y="245" width="230" height="64" rx="6" fill="#ffffff" stroke="#7a4fc9"/>
  <text x="795" y="268" text-anchor="middle" font-family="monospace" font-size="12">submit_decision(결정, 이유, 근거 id)</text>
  <text x="795" y="290" text-anchor="middle" fill="#5b6672" font-size="12">"WAIT 또는 ROUTE_1"</text>
  <!-- 화살표 (수평에 가깝게, 라벨은 위/아래) -->
  <line x1="270" y1="175" x2="660" y2="130" stroke="#3b4652" stroke-width="2" marker-end="url(#a)"/>
  <text x="465" y="125" text-anchor="middle" fill="#3b4652">① 막힌 도로, 선택지(우회 ETA·해제 시각), 도구 설명</text>
  <line x1="680" y1="192" x2="270" y2="248" stroke="#7a4fc9" stroke-width="2" marker-end="url(#p)"/>
  <text x="440" y="232" text-anchor="middle" fill="#7a4fc9">② AI가 search_road_news 호출</text>
  <line x1="270" y1="280" x2="680" y2="212" stroke="#b08a3e" stroke-width="2" marker-end="url(#g)"/>
  <text x="500" y="300" text-anchor="middle" fill="#8a6a2a">③ 상위 3건 (그 시각까지 나온, 그 도로 기사만)</text>
  <line x1="680" y1="285" x2="270" y2="352" stroke="#7a4fc9" stroke-width="2" marker-end="url(#p)"/>
  <text x="480" y="372" text-anchor="middle" fill="#7a4fc9">④ AI가 submit_decision 호출 (근거 N12·G1 등)</text>
  <!-- 하단 주 -->
  <text x="660" y="385" fill="#3b4652">⑤ 서버가 결정대로 입구 대기 또는 우회</text>
  <text x="660" y="415" fill="#9a3b3b">AI 실패·시간 초과 → 우회(ROUTE_1), 주행은 계속</text>
  <text x="660" y="445" fill="#5b6672" font-size="13">Gemini 호출만 외부, 자료·검색·결정 적용은 로컬</text>
</svg>
